<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>续火花 · 登录</title>
<link rel="stylesheet" href="app.css">
<style>
  body{
    display:grid;place-items:center;overflow:hidden;
    background:
      radial-gradient(1100px 520px at 50% -12%, #E9F1FC 0%, rgba(234,242,253,0) 62%),
      var(--bg);
  }
  .login-brand{position:fixed;left:40px;top:34px;display:flex;align-items:center;gap:11px}
  .login-brand .brand-mark{width:36px;height:36px;border-radius:11px}
  .login-brand .brand-mark .brand-emoji{font-size:21px}
  .login-brand__text{display:grid;line-height:1.15}
  .login-brand__text strong{font-size:15px;font-weight:750;letter-spacing:-.3px}
  .login-brand__text small{margin-top:2px;color:var(--ink-3);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .login-host{position:fixed;right:40px;top:44px;color:var(--ink-4);font-family:var(--mono);font-size:11px;letter-spacing:.04em}

  .login-card{
    width:428px;padding:30px 30px 24px;border:1px solid var(--line);border-radius:22px;
    background:var(--surface);box-shadow:0 26px 70px rgba(18,23,32,.09),0 2px 6px rgba(18,23,32,.04);
  }
  .login-eyebrow{display:flex;align-items:center;gap:7px;margin:0 0 12px;color:var(--ink-3);font-size:12px;font-weight:550}
  .login-eyebrow .dot{width:6px;height:6px;background:var(--blue)}
  .login-card h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-1px;line-height:1.15}
  .login-sub{margin:9px 0 0;color:var(--ink-3);font-size:13px;line-height:1.6}

  .who-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}
  .who{
    position:relative;display:grid;justify-items:center;gap:7px;padding:13px 6px 11px;
    border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;
    transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .who .avatar{width:36px;height:36px;border-radius:11px;font-size:13px;background:#EEF2F8;color:#5D6B7D}
  .who b{font-size:12.5px;font-weight:620;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .who small{color:var(--ink-3);font-size:10.5px}
  .who[aria-pressed="true"]{border-color:#9CC3EE;background:var(--blue-soft-2);box-shadow:0 0 0 3px rgba(0,102,204,.08)}
  .who[aria-pressed="true"] .avatar{background:var(--blue-soft);color:var(--blue-ink)}
  .who[aria-pressed="true"] small{color:var(--blue-ink)}
  .who__check{position:absolute;top:7px;right:7px;display:none;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--blue);color:#fff}
  .who__check .i{width:9px;height:9px;stroke-width:3.4}
  .who[aria-pressed="true"] .who__check{display:grid}

  .login-field{margin-top:20px}
  .login-field .field-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
  .login-field .field-row span{color:var(--ink-2);font-size:12.5px;font-weight:600}
  .login-field .field-row a{color:var(--ink-3);font-size:11.5px;text-decoration:none}
  .login-field .field-row a:hover{color:var(--blue)}
  .login-input{
    display:flex;align-items:center;gap:9px;height:46px;padding:0 6px 0 13px;
    border:1px solid #9CC3EE;border-radius:12px;background:#fff;box-shadow:0 0 0 3px var(--blue-ring);
  }
  .login-input .i{width:16px;height:16px;color:var(--ink-4)}
  .login-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;letter-spacing:.02em}
  .login-input button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--ink-4)}
  .login-input button:hover{background:var(--surface-3);color:var(--ink-2)}
  .login-input button .i{width:16px;height:16px}

  .login-submit{width:100%;min-height:48px;margin-top:18px;border-radius:12px;font-size:14.5px;font-weight:650}
  .login-help{margin:14px 0 0;color:var(--ink-3);font-size:11.5px;line-height:1.6;text-align:center}
  .login-help a{color:var(--blue-ink);text-decoration:none;font-weight:550}

  .login-foot{position:fixed;left:40px;right:40px;bottom:28px;display:flex;align-items:center;justify-content:space-between;color:var(--ink-4);font-size:11.5px}
  .login-foot span{display:inline-flex;align-items:center;gap:6px}
  .login-foot .i{width:13px;height:13px}
  .login-foot .mono{letter-spacing:.03em}
</style>
</head>
<body>
<svg class="svg-sprite" aria-hidden="true">
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12.7 2.2c.4 3.5-1.2 5.7-3.5 7.9-2 1.9-3.5 3.8-3.5 6.2a6.3 6.3 0 0 0 12.6 0c0-3-1.5-5.8-5-9.2.1 2.4-.5 3.6-1.5 4.7-.2-3.9-1.5-7-2.1-9.6Z" fill="currentColor" stroke="none"/><path d="M12 20.9a3.4 3.4 0 0 1-3.4-3.4c0-1.3.8-2.4 2-3.5.7-.6 1.2-1.3 1.4-2.2.6.9.7 1.7.7 2.6.9-.6 1.3-1.3 1.3-2.1.9 1 1.3 2.1 1.3 3.4a3.4 3.4 0 0 1-3.3 3.2Z" fill="#fff" stroke="none"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="2.2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/><path d="M12 14v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="3.1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.2 4.6 4.6L19.8 6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v5c0 5-3.4 8.3-8 10-4.6-1.7-8-5-8-10V6l8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>

<header class="login-brand">
  <span class="brand-mark" aria-hidden="true"><span class="brand-emoji">🔥</span></span>
  <span class="login-brand__text"><strong>续火花</strong><small>Douyin Fire</small></span>
</header>
<p class="login-host">127.0.0.1:50885</p>

<section class="login-card" aria-labelledby="loginTitle">
  <p class="login-eyebrow"><span class="dot" aria-hidden="true"></span>本机 · 4 位成员</p>
  <h1 id="loginTitle">欢迎回来</h1>
  <p class="login-sub">选择你的账号并输入密码。每位成员只能看到自己的好友、消息和运行记录。</p>

  <div class="who-row" role="group" aria-label="选择成员">
    <button class="who" type="button" aria-pressed="true">
      <span class="avatar" aria-hidden="true">悠</span>
      <b>小悠米</b>
      <small>管理员</small>
      <span class="who__check" aria-hidden="true"><svg class="i"><use href="#i-check"/></svg></span>
    </button>
    <button class="who" type="button" aria-pressed="false">
      <span class="avatar" aria-hidden="true">澈</span>
      <b>阿澈</b>
      <small>成员</small>
    </button>
    <button class="who" type="button" aria-pressed="false">
      <span class="avatar" aria-hidden="true">满</span>
      <b>林小满</b>
      <small>成员</small>
    </button>
  </div>

  <div class="login-field">
    <div class="field-row"><span>密码</span><a href="#">忘记密码？</a></div>
    <div class="login-input">
      <svg class="i" aria-hidden="true"><use href="#i-lock"/></svg>
      <input type="password" value="douyin-fire" aria-label="密码" autocomplete="current-password">
      <button type="button" aria-label="显示密码"><svg class="i"><use href="#i-eye"/></svg></button>
    </div>
  </div>

  <button class="btn btn--primary login-submit" type="button">登录</button>
  <p class="login-help">忘记密码时，请让管理员在「用户与成员」里重置。<br>密码只在本机校验，不会上传。</p>
</section>

<footer class="login-foot">
  <span><svg class="i"><use href="#i-shield"/></svg>本地运行 · 数据不离开这台电脑</span>
  <span class="mono">v0.1.5</span>
</footer>
</body>
</html>
